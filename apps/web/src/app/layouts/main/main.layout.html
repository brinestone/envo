<div hlmSidebarWrapper variant="inset">
  <hlm-sidebar>
    <div hlmSidebarHeader>
      <ul hlmSidebarMenu>
        <li hlmSidebarMenuItem>
          <button
            hlmSidebarMenuButton
            [hlmDropdownMenuTrigger]="selectors"
            side="right"
            align="start"
          >
            @if (activeOrganization(); as org) {
              <img [src]="org.logo" width="25" class="rounded-md" />
              <span>{{ org.name }}</span>
            } @else {
              <span>Select Organization</span>
            }
            <ng-icon name="lucideChevronDown" class="ml-auto" />
          </button>
        </li>
      </ul>
    </div>
    <div hlmSidebarContent>
      <div hlmSidebarGroup></div>
    </div>
    <div hlmSidebarFooter>footer</div>
  </hlm-sidebar>
  <div class="relative h-full w-full">
    <header class="sticky top-0 w-full left-0 flex h-12 items-center justify-between px-4">
      <button hlmSidebarTrigger><span class="sr-only"></span></button>
    </header>
    <router-outlet />
  </div>
</div>

<ng-template #selectors>
  <hlm-dropdown-menu class="w-60">
    @if (loadingOrgs()) {
      @for (_ of [1, 3, 4]; track $index) {
        <hlm-skeleton class="h-3 w-full" />
      }
    } @else {
      @for (org of organizations(); track org.id) {
        <button hlmDropdownMenuItem (click)="selectOrganization(org.id)">
          <span>{{ org.name }}</span>
          @if (org.id == activeOrganization()?.id) {
            <ng-icon name="lucideCheck" class="ml-auto" />
          }
        </button>
      }
      <a
        [disabled]=""
        hlmDropdownMenuItem
        [routerLink]="[{ outlets: { dialog: ['new-org'] } }]"
        [replaceUrl]="true"
        queryParamsHandling="preserve"
        >Add Organization</a
      >
    }
  </hlm-dropdown-menu>
</ng-template>

<router-outlet name="dialog" (deactivate)="onDialogOutletDeactivated()" />
