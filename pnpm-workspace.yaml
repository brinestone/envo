packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@better-auth/drizzle-adapter": ^1.7.22
  "@types/node": ^24
  "@types/pg": ^8.23.1
  better-auth: ^1.7.22
  dotenv: ^18.0.10
  dotenv-expand: ^1000.0.0
  drizzle-kit: 1.0.0-rc.5
  drizzle-orm: 1.0.0-rc.5
  orval: ^8.47.0
  pg: ^8.23.1
  typescript: ^7.0.2
  ulid: ^3.0.2
  unique-names-generator: ^4.7.1
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
  vitest: 5.0.5
  zod: ^4.6.7
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
supportedArchitectures:
  cpu:
    - current
  os:
    - current
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
permissions:
  drizzle-kit:
    skills: true

skills:
  dirs:
    - .agents/skills
    - .gemini/skills
    - .cursor/skills
